name: tests

# The suite exists so defects stop being found one at a time, by hand. That
# only works if something runs it without being asked.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    # Windows, not by preference. proxy_config imports winreg and proxy_ca
    # opens crypt32 at module scope, so the suite cannot even be imported
    # anywhere else.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.10 is what the published executable is built with; 3.13 is there to
        # catch a break before it reaches a contributor's machine.
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        # The same set the README tells a contributor to install, so CI fails
        # for the same reasons their machine would.
        run: |
          python -m pip install --upgrade pip
          pip install pystray Pillow psutil pywin32 cryptography certifi

      - name: Byte-compile every module
        # A syntax error should not have to wait for a test to import it.
        run: python -m compileall -q SpotifyAdRemover

      - name: Run the suite
        # -W error::ResourceWarning: leaked handles are how the suite starts
        # drowning its own signal in noise.
        run: python -W error::ResourceWarning -m unittest discover -s SpotifyAdRemover/tests -v
